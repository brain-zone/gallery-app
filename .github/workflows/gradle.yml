name: Java CI with Gradle

on:
  push:
    branches: ["develop"]
    paths:
      - 'modernised/gallery/src/**'
      - 'modernised/gallery/**/*.gradle*'
      - 'modernised/gallery/**/*.properties'
      - 'modernised/gallery/gradlew'
      - 'modernised/gallery/gradle/**'
      - '.github/workflows/gradle.yml'

  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

  workflow_dispatch:

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        working-directory: modernised/gallery
        run: ./gradlew build --no-daemon