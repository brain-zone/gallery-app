<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authentication required · Barbara Israel Fine Arts</title>
    <link rel="stylesheet" th:href="@{/css/gallery.css(v='gal005-text-navigation-2')}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Barbara Israel Fine Arts"></header>
      <div class="page-body">
        <aside class="sidebar">
          <nav th:replace="~{fragments/navigation :: navigation('', false)}"></nav>
          <img class="sidebar-image" th:src="@{/images/leftimage1.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage2.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage3.jpg}" alt="">
        </aside>
        <div class="content-divider" aria-hidden="true"></div>
        <main class="main-content">
          <section class="error-box">
            <h1>Authentication required</h1>
            <p>You need to sign in to access this resource.</p>
            <p><a th:href="@{/login}">Sign in</a> or go <a th:href="@{/}">Home</a>.</p>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
