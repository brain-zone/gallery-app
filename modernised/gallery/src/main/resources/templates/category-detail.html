<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${category.categoryName} · Barbara Israel Fine Arts|">Gallery category</title>
    <link rel="stylesheet" th:href="@{/css/gallery.css}">
    <script defer th:src="@{/js/artwork-lightbox.js}"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Barbara Israel Fine Arts"></header>
      <div class="page-body">
        <aside class="sidebar">
          <nav th:replace="~{fragments/navigation :: navigation}"></nav>
          <img class="sidebar-image" th:src="@{/images/leftimage1.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage2.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage3.jpg}" alt="">
        </aside>
        <div class="content-divider" aria-hidden="true"></div>
        <main class="main-content">
          <div class="breadcrumb">
            <a th:href="@{/categories}">Galleries:</a>
            <span th:text="${category.categoryName}">Category</span>
          </div>

          <div class="gallery-stage">
            <section class="gallery-text-area">
              <h1 th:text="${category.categoryName}">Category</h1>
              <p th:if="${category.categoryDescription}" th:text="${category.categoryDescription}">
                Category description
              </p>
              <p th:unless="${#lists.isEmpty(category.artworks)}">Select an artwork to view its details.</p>
              <p th:if="${#lists.isEmpty(category.artworks)}">No artwork is available.</p>
            </section>

            <section class="gallery-image-area">
              <p class="empty-gallery" th:if="${#lists.isEmpty(category.artworks)}">
                No artwork is available.
              </p>
              <th:block th:if="${category.selectedArtwork}"
                        th:with="featured=${category.selectedArtwork}">
                <a class="gallery-image-link"
                   th:if="${category.featuredImageUrl}"
                   th:href="${category.featuredImageLinkUrl}"
                   data-artwork-lightbox-trigger>
                  <img th:src="${category.featuredImageUrl}"
                       th:alt="${featured.title}">
                </a>
                <dialog class="artwork-lightbox"
                        th:if="${category.featuredImageUrl}"
                        aria-labelledby="artwork-lightbox-title">
                  <div class="artwork-lightbox__content">
                    <img class="artwork-lightbox__image"
                         th:src="${category.featuredImageLinkUrl}"
                         th:alt="${featured.title}">
                    <div class="artwork-lightbox__details">
                      <div>
                        <h2 id="artwork-lightbox-title" th:text="${featured.title}">Artwork</h2>
                        <p th:if="${category.selectedArtworkArtist}"
                           th:text="|Artwork by ${category.selectedArtworkArtist}|">
                          Artwork by Artist
                        </p>
                      </div>
                      <form method="dialog">
                        <button class="artwork-lightbox__close" type="submit" autofocus>
                          <img th:src="@{/images/closelabel.gif}" alt="Close">
                        </button>
                      </form>
                    </div>
                  </div>
                </dialog>
                <span th:unless="${category.featuredImageUrl}"
                      th:text="${featured.title}">
    Artwork
  </span>
                <div class="gallery-artwork-navigation">
                  <a class="gallery-artwork-navigation__previous"
                     th:if="${category.previousArtwork}"
                     th:href="@{/categories/{categoryId}/artworks/{artworkId}(categoryId=${category.id},artworkId=${category.previousArtwork.id})}"
                     th:aria-label="|Previous artwork: ${category.previousArtwork.title}|">
                    <img th:src="@{/images/previous.gif}" alt="Previous artwork">
                  </a>
                  <span class="gallery-artwork-navigation__previous"
                        th:unless="${category.previousArtwork}"
                        aria-hidden="true"></span>
                  <h2 class="gallery-image-title" th:text="${featured.title}">Artwork</h2>
                  <a class="gallery-artwork-navigation__next"
                     th:if="${category.nextArtwork}"
                     th:href="@{/categories/{categoryId}/artworks/{artworkId}(categoryId=${category.id},artworkId=${category.nextArtwork.id})}"
                     th:aria-label="|Next artwork: ${category.nextArtwork.title}|">
                    <img th:src="@{/images/next.gif}" alt="Next artwork">
                  </a>
                  <span class="gallery-artwork-navigation__next"
                        th:unless="${category.nextArtwork}"
                        aria-hidden="true"></span>
                </div>
                <p th:if="${category.selectedArtworkArtist}"
                   th:text="|Artwork by ${category.selectedArtworkArtist}|">
                  Artwork by Artist
                </p>
                <p>
                  <a th:href="@{/artworks/{id}(id=${featured.id})}">View artwork details</a>
                </p>
              </th:block>
            </section>
          </div>

          <div class="gallery-thumbnails" th:unless="${#lists.isEmpty(category.artworks)}">
            <div class="thumbnail-strip">
              <a class="gallery-thumbnail"
                 th:each="artwork : ${category.artworks}"
                 th:href="@{/categories/{categoryId}/artworks/{artworkId}(categoryId=${category.id},artworkId=${artwork.id})}"
                 th:title="${artwork.title}">
                <img th:if="${artwork.imageUrl}"
                     th:src="${artwork.imageUrl}"
                     th:alt="${artwork.title}">
                <span class="visually-hidden" th:unless="${artwork.imageUrl}" th:text="${artwork.title}">
                  Artwork
                </span>
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
