<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/gallery.css(v='gal005-text-navigation-2')}">
    <script defer th:src="@{/js/artwork-detail-lightbox.js}"></script>
    <title th:text="|${artwork.title} · Barbara Israel Fine Arts|">Artwork</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Barbara Israel Fine Arts"></header>
      <div class="page-body">
        <aside class="sidebar">
          <nav th:replace="~{fragments/navigation :: navigation('galleries', false)}"></nav>
          <img class="sidebar-image" th:src="@{/images/leftimage1.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage2.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage3.jpg}" alt="">
        </aside>
        <div class="content-divider" aria-hidden="true"></div>
        <main class="main-content">
          <div class="breadcrumb">
            <a th:href="@{/categories}">Galleries:</a>
            <span th:if="${!#lists.isEmpty(artwork.categories)}"
                  th:text="${artwork.categories[0].categoryName}">Category</span>
            <span th:if="${#lists.isEmpty(artwork.categories)}">Artwork</span>
          </div>

          <div class="gallery-stage">
            <section class="gallery-text-area">
              <h1 th:text="${artwork.title}">Artwork title</h1>
              <p th:if="${artwork.subTitle}" th:text="${artwork.subTitle}">Subtitle</p>
              <p th:if="${artwork.description}" th:text="${artwork.description}">Description</p>

              <dl class="gallery-meta">
                <dt th:if="${artwork.artist}">Artist</dt>
                <dd th:if="${artwork.artist}" th:text="${artwork.artist}">Artist</dd>
                <dt th:if="${artwork.genre}">Genre</dt>
                <dd th:if="${artwork.genre}" th:text="${artwork.genre}">Genre</dd>
                <dt th:if="${artwork.displayDate}">Date</dt>
                <dd th:if="${artwork.displayDate}" th:text="${artwork.displayDate}">Date</dd>
                <dt th:if="${artwork.media}">Media</dt>
                <dd th:if="${artwork.media}" th:text="${artwork.media}">Media</dd>
                <dt>Dimensions</dt>
                <dd th:text="|${artwork.width} × ${artwork.height}|">0 × 0</dd>
              </dl>

              <div class="gallery-category-links" th:unless="${#lists.isEmpty(artwork.categories)}">
                <span>Galleries</span>
                <ul>
                  <li th:each="category : ${artwork.categories}">
                    <a th:href="@{/categories/{categoryId}/artworks/{artworkId}(categoryId=${category.id},artworkId=${artwork.id})}"
                       th:text="${category.categoryName}">Category</a>
                  </li>
                </ul>
              </div>
            </section>

            <section class="gallery-image-area">
              <th:block th:each="rendition : ${artwork.renditions}"
                        th:if="${rendition.url == displayImageUrl}">
                <a class="gallery-image-link"
                   th:href="${displayImageUrl}"
                   data-artwork-detail-lightbox-trigger
                   th:aria-label="|Open original image of ${artwork.title}|"
                   th:attr="data-artwork-title=${artwork.title}">
                  <img class="gallery-primary-image"
                       th:src="${rendition.url}"
                       th:alt="|${artwork.title} ${rendition.type} image|"
                       data-artwork-detail-canvas-image>
                </a>
              </th:block>
              <p class="empty-gallery" th:unless="${displayImageUrl}">Image unavailable.</p>
              <h2 class="gallery-image-title" th:text="${artwork.title}">Artwork title</h2>
            </section>
          </div>

          <div class="gallery-thumbnails artwork-renditions"
               th:unless="${#lists.isEmpty(artwork.renditions)}">
            <div class="thumbnail-strip">
              <a class="artwork-rendition"
                 th:each="rendition : ${artwork.renditions}"
                 th:href="${rendition.url}"
                 th:title="|${artwork.title} · ${rendition.type}|"
                 data-artwork-detail-rendition-selector
                 th:aria-current="${rendition.url == displayImageUrl} ? 'true' : null"
                 th:attr="data-rendition-label=${rendition.type},
                          data-rendition-width=${rendition.width},
                          data-rendition-height=${rendition.height}">
                <img class="artwork-rendition__image"
                     th:src="${rendition.url}"
                     th:alt="|${artwork.title} ${rendition.type} image|">
                <span class="artwork-rendition__label" th:text="${rendition.type}">ORIGINAL</span>
                <span class="artwork-rendition__dimensions"
                      th:if="${rendition.width != null && rendition.height != null}"
                      th:text="|${rendition.width} × ${rendition.height}|">1024 × 1024</span>
              </a>
            </div>
          </div>

          <dialog class="artwork-detail-lightbox"
                  th:unless="${#lists.isEmpty(artwork.renditions)}"
                  aria-labelledby="artwork-detail-lightbox-title">
            <div class="artwork-detail-lightbox__content">
              <form class="artwork-detail-lightbox__close-form" method="dialog">
                <button class="artwork-lightbox__close" type="submit" autofocus>Close</button>
              </form>
              <img class="artwork-detail-lightbox__image"
                   th:src="${displayImageUrl}"
                   th:alt="|Original image of ${artwork.title}|">
              <div class="artwork-detail-lightbox__details">
                <h2 id="artwork-detail-lightbox-title" th:text="${artwork.title}">Artwork title</h2>
              </div>
            </div>
          </dialog>
        </main>
      </div>
    </div>
  </body>
</html>
