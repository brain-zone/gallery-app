<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${artwork.title}">Artwork</title>
  </head>
  <body>
    <main>
      <nav><a th:href="@{/categories}">All categories</a></nav>
      <h1 th:text="${artwork.title}">Artwork title</h1>
      <p th:if="${artwork.subTitle}" th:text="${artwork.subTitle}">Subtitle</p>
      <p th:if="${artwork.description}" th:text="${artwork.description}">Description</p>

      <dl>
        <dt th:if="${artwork.displayDate}">Display date</dt>
        <dd th:if="${artwork.displayDate}" th:text="${artwork.displayDate}">Date</dd>
        <dt th:if="${artwork.media}">Media</dt>
        <dd th:if="${artwork.media}" th:text="${artwork.media}">Media</dd>
        <dt>Dimensions</dt>
        <dd th:text="|${artwork.width} × ${artwork.height}|">0 × 0</dd>
        <dt th:if="${artwork.caption}">Caption</dt>
        <dd th:if="${artwork.caption}" th:text="${artwork.caption}">Caption</dd>
      </dl>

      <section th:unless="${#lists.isEmpty(artwork.categories)}">
        <h2>Categories</h2>
        <ul>
          <li th:each="category : ${artwork.categories}">
            <a th:href="@{/categories/{id}(id=${category.id})}"
               th:text="${category.categoryName}">Category</a>
          </li>
        </ul>
      </section>

      <section th:unless="${#lists.isEmpty(artwork.renditions)}">
        <h2>Image renditions</h2>
        <table>
          <thead>
            <tr><th>Type</th><th>Object key</th><th>Content type</th><th>Dimensions</th></tr>
          </thead>
          <tbody>
            <tr th:each="rendition : ${artwork.renditions}">
              <td th:text="${rendition.type}">Type</td>
              <td th:text="${rendition.objectKey}">Object key</td>
              <td th:text="${rendition.contentType}">Content type</td>
              <td th:text="|${rendition.width} × ${rendition.height}|">0 × 0</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
