<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/gallery.css}">
    <title th:text="|${artwork.title} · Barbara Israel Fine Arts|">Artwork</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Barbara Israel Fine Arts"></header>
      <div class="page-body">
        <aside class="sidebar">
          <nav th:replace="~{fragments/navigation :: navigation}"></nav>
          <img class="sidebar-image" th:src="@{/images/leftimage1.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage2.jpg}" alt="">
          <img class="sidebar-image" th:src="@{/images/leftimage3.jpg}" alt="">
        </aside>
        <div class="content-divider" aria-hidden="true"></div>
        <main class="main-content">
          <div class="breadcrumb">
            <a th:href="@{/categories}">Galleries:</a>
            <span th:if="${!#lists.isEmpty(artwork.categories)}"
                  th:text="${artwork.categories[0].categoryName}">Category</span>
            <span th:if="${#lists.isEmpty(artwork.categories)}">Artwork</span>
          </div>

          <div class="gallery-stage">
            <section class="gallery-text-area">
              <h1 th:text="${artwork.title}">Artwork title</h1>
              <p th:if="${artwork.subTitle}" th:text="${artwork.subTitle}">Subtitle</p>
              <p th:if="${artwork.description}" th:text="${artwork.description}">Description</p>

              <dl class="gallery-meta">
                <dt th:if="${artwork.artist}">Artist</dt>
                <dd th:if="${artwork.artist}" th:text="${artwork.artist}">Artist</dd>
                <dt th:if="${artwork.genre}">Genre</dt>
                <dd th:if="${artwork.genre}" th:text="${artwork.genre}">Genre</dd>
                <dt th:if="${artwork.displayDate}">Date</dt>
                <dd th:if="${artwork.displayDate}" th:text="${artwork.displayDate}">Date</dd>
                <dt th:if="${artwork.media}">Media</dt>
                <dd th:if="${artwork.media}" th:text="${artwork.media}">Media</dd>
                <dt>Dimensions</dt>
                <dd th:text="|${artwork.width} × ${artwork.height}|">0 × 0</dd>
              </dl>

              <div class="gallery-category-links" th:unless="${#lists.isEmpty(artwork.categories)}">
                <span>Galleries</span>
                <ul>
                  <li th:each="category : ${artwork.categories}">
                    <a th:href="@{/categories/{id}(id=${category.id})}"
                       th:text="${category.categoryName}">Category</a>
                  </li>
                </ul>
              </div>
            </section>

            <section class="gallery-image-area">
              <a class="gallery-image-link"
                 th:if="${artwork.primaryImageUrl}"
                 th:href="${artwork.primaryImageUrl}">
                <img class="gallery-primary-image"
                     th:src="${artwork.primaryImageUrl}"
                     th:alt="${artwork.title}">
              </a>
              <p class="empty-gallery" th:unless="${artwork.primaryImageUrl}">Image unavailable.</p>
              <h2 class="gallery-image-title" th:text="${artwork.title}">Artwork title</h2>
            </section>
          </div>

          <div class="gallery-thumbnails" th:unless="${#lists.isEmpty(artwork.renditions)}">
            <div class="thumbnail-strip">
              <a class="gallery-thumbnail"
                 th:each="rendition : ${artwork.renditions}"
                 th:href="${rendition.url}"
                 th:title="|${artwork.title} · ${rendition.type}|">
                <img th:src="${rendition.url}" th:alt="|${artwork.title} ${rendition.type} image|">
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
