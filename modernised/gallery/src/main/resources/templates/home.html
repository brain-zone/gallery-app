<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barbara Israel Fine Arts</title>
    <link rel="stylesheet" th:href="@{/css/gallery.css}">
  </head>
  <body>
    <main class="home-shell">
      <img
        class="home-logo"
        th:src="@{/images/indexlogo.gif}"
        alt="Barbara Israel Fine Arts">
      <img
        class="home-artwork"
        th:src="@{/images/indeximage.jpg}"
        alt="">
      <img
        class="home-divider"
        th:src="@{/images/indexline.gif}"
        alt="">
      <nav th:replace="~{fragments/navigation :: navigation('home', true)}"></nav>
    </main>
  </body>
</html>
