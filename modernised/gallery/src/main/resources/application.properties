spring.application.name=gallery
spring.flyway.enabled=true
spring.datasource.url=jdbc:h2:file:${GALLERY_DATABASE_PATH:./gallery-data/gallery}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.web.resources.cache.period=1h
gallery.artwork.storage.root=${GALLERY_ARTWORK_STORAGE_ROOT:./artwork-media}
gallery.artwork.upload.max-bytes=${GALLERY_ARTWORK_UPLOAD_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

